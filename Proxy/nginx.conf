# Docker's embedded DNS resolver
resolver 127.0.0.11 valid=10s ipv6=off;

# Rate limits are per client IP address.
# API: average of 10 requests/second, burst of 20.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Frontend: average of 30 requests/second, burst of 50.
limit_req_zone $binary_remote_addr zone=frontend_limit:10m rate=30r/s;

# Limit concurrent connections per client IP.
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Log rate-limited requests separately.
limit_req_status 429;
limit_conn_status 429;

upstream frontend_servers {
    zone frontend_servers 64k;
    server frontend:80 resolve;
}

upstream api_servers {
    zone api_servers 64k;
    least_conn;
    server api:8080 resolve;
}

server {
    listen 80;
    server_name _;

    # Limit request body size (adjust for legitimate uploads).
    client_max_body_size 10m;

    # Limit concurrent connections per client IP.
    limit_conn conn_limit 20;

    # ASP.NET Core API
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://api_servers;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
	
	# ASP.NET Core API Swagger
	location /swagger/ {
		proxy_pass http://api_servers;

		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

    # Vue frontend
    location / {
        limit_req zone=frontend_limit burst=50 nodelay;

        proxy_pass http://frontend_servers;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}